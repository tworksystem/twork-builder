<section class="wp-block-twork-logo-showcase-section partners" data-block="twork/logo-showcase-section" data-version="1" aria-label="Partners">
<div class="partners__inner l-section">
<div class="partners__top">
<header class="partners__head">
<p class="section-head__eyebrow">{{attr:eyebrow}}</p>
<h2 class="section-head__title">{{attr:title}}</h2>
</header>
<div class="partners__desc">
<p><strong>{{attr:descriptionBold}}</strong>{{attr:description}}</p>
<p class="partners__more">For more information about brands. <a href="{{attr:readMoreHref}}">{{attr:readMoreLabel}}</a></p>
</div>
</div>
<div class="partners__logos" data-list="logos">{{INNER}}</div>
</div>
</section>
