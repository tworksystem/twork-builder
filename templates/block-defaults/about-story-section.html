<section class="wp-block-twork-about-story-section about-story" data-block="twork/about-story-section" data-version="1">
<div class="about-story__inner l-section">
<div class="about-story__intro" id="story">
<div class="about-story__intro-text">
<header class="section-head section-head--row"><div>
<p class="section-head__eyebrow">{{attr:eyebrow}}</p>
<h2 class="section-head__title">{{attr:title}}</h2>
</div></header>
{{ABOUT_STORY_PARAGRAPHS}}
<a class="btn btn--primary" href="{{attr:ctaHref}}">{{attr:ctaLabel}}</a>
</div>
{{ABOUT_STORY_IMAGE}}
</div>
<div class="about-story__milestones">
<header class="section-head">
<p class="section-head__eyebrow">{{attr:timelineEyebrow}}</p>
<h2 class="section-head__title">{{attr:timelineTitle}}</h2>
</header>
<div class="about-story__timeline" data-list="milestones">{{ABOUT_STORY_MILESTONES}}</div>
</div>
<div class="about-story__values">
<header class="section-head">
<p class="section-head__eyebrow">{{attr:valuesEyebrow}}</p>
<h2 class="section-head__title">{{attr:valuesTitle}}</h2>
</header>
<div class="about-story__values-grid" data-list="values">{{ABOUT_STORY_VALUES}}</div>
</div>
</div>
</section>
