<section class="wp-block-twork-review-carousel testimonials" data-block="twork/review-carousel" data-version="1" data-testimonials="1" aria-label="Testimonials">
<div class="testimonials__inner l-section">
<header class="section-head section-head--row">
<div>
<p class="section-head__eyebrow">{{attr:eyebrow}}</p>
<h2 class="section-head__title">{{attr:title}}</h2>
</div>
<div class="carousel-dots testimonials__dots" data-testimonials-dots></div>
</header>
<div class="testimonials__stage">
<button type="button" class="carousel-nav__btn" data-action="testimonials-prev" aria-label="Previous">‹</button>
<div class="testimonials__track" data-list="items" data-testimonials-track tabindex="0">{{INNER}}</div>
<button type="button" class="carousel-nav__btn" data-action="testimonials-next" aria-label="Next">›</button>
</div>
</div>
</section>
