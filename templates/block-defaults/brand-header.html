<header class="wp-block-twork-brand-header header" data-block="twork/brand-header" data-version="1">
<div class="header__main"><div class="header__inner l-section">
<a class="header__brand" href="{{attr:homeUrl}}" aria-label="{{attr:brandName}} home"><span class="header__brand-text">{{attr:brandName}}</span></a>
<nav id="header-nav" class="header__nav" aria-label="Main navigation" data-list="menuItems">{{INNER}}</nav>
<div class="header__actions">
<button type="button" class="header__icon-btn" aria-label="Search"></button>
<div class="header__hotline"><div>
<p class="header__hotline-label">{{attr:hotlineLabel}}</p>
<a class="header__hotline-phone" href="#">{{attr:phone}}</a>
</div></div>
<button class="header__toggle" type="button" data-action="menu-toggle" aria-expanded="false" aria-controls="header-nav"><span class="u-hidden">Menu</span><span class="header__toggle-bar" aria-hidden="true"></span></button>
</div></div></div>
</header>
