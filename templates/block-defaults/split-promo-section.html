<section class="wp-block-twork-split-promo-section app-promo" data-block="twork/split-promo-section" data-version="1" aria-label="Orders and wholesale">
<div class="app-promo__inner l-section">
<div class="app-promo__grid">
<div class="app-promo__visual">
<img src="{{attr:imageUrl}}" alt="{{attr:imageAlt}}" width="560" height="480" loading="lazy" decoding="async" />
</div>
<div class="app-promo__content">
<p class="section-head__eyebrow">{{attr:eyebrow}}</p>
<h2 class="section-head__title app-promo__title">{{attr:title}}</h2>
<ul class="app-promo__features" data-list="features"></ul>
<div class="app-promo__stores">
<a class="app-promo__store btn btn--dark" href="{{attr:primaryHref}}">{{attr:primaryLabel}}</a>
<a class="app-promo__store btn btn--dark" href="{{attr:secondaryHref}}">{{attr:secondaryLabel}}</a>
</div>
</div>
</div>
</div>
</section>
