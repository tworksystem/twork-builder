<a class="wp-block-twork-category-card product-categories__card" data-block="twork/category-card" data-item-id="{{attr:itemId}}" href="{{attr:href}}">
<div class="product-categories__text">
<h3 class="product-categories__name">{{attr:title}}</h3>
<p class="product-categories__count">{{attr:count}}</p>
<span class="product-categories__arrow" aria-hidden="true">→</span>
</div>
<img class="product-categories__img" src="{{attr:imageUrl}}" alt="{{attr:imageAlt}}" width="140" height="140" loading="lazy" decoding="async" />
</a>
