<span class="why-choose-us__number" aria-hidden="true">{{attr:number}}</span>
<div class="why-choose-us__icon" aria-hidden="true" data-icon="{{attr:icon}}"></div>

<p class="why-choose-us__text">{{attr:text}}</p>
