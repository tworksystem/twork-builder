<article class="wp-block-twork-image-card-slide services-carousel__card" data-block="twork/image-card-slide" data-carousel-slide="true" data-item-id="{{attr:itemId}}" aria-hidden="true">
<div class="services-carousel__media">
<img src="{{attr:imageUrl}}" alt="{{attr:imageAlt}}" width="380" height="280" loading="lazy" decoding="async" />
</div>
<div class="services-carousel__box">
<h3 class="services-carousel__card-title">{{attr:title}}</h3>
<a class="services-carousel__link" href="{{attr:href}}">{{attr:ctaLabel}}</a>
</div>
</article>
