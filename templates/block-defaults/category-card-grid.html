<section class="wp-block-twork-category-card-grid product-categories" data-block="twork/category-card-grid" data-version="1" aria-label="Product categories">
<div class="product-categories__inner l-section">
<header class="section-head">
<p class="section-head__eyebrow">{{attr:eyebrow}}</p>
<h2 class="section-head__title">{{attr:title}}</h2>
</header>
<div class="product-categories__grid" data-list="items">
{{INNER}}
<a class="product-categories__card product-categories__card--cta" href="{{attr:ctaHref}}"><span>{{attr:ctaLabel}}</span><span class="product-categories__cta-arrow" aria-hidden="true">→</span></a>
</div>
</div>
</section>
