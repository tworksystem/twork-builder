<article class="wp-block-twork-hero-banner-slide hero__slide" data-carousel-slide="true" data-item-id="{{attr:itemId}}" aria-hidden="true">
<div class="hero__overlay"><div class="hero__inner l-section"><div class="hero__content">
<p class="hero__eyebrow">{{attr:eyebrow}}</p>
<h1 class="hero__title">{{attr:title}}</h1>
<p class="hero__subtitle">{{attr:subtitle}}</p>
<a class="hero__cta btn btn--primary" href="{{attr:ctaHref}}">{{attr:ctaLabel}}<span class="hero__cta-icon" aria-hidden="true"> ›</span></a>
</div></div></div></article>
