<section class="wp-block-twork-hero-banner-carousel hero" data-block="twork/hero-banner-carousel" data-version="1" aria-label="Hero">
<div class="hero__wrap" role="region" aria-roledescription="carousel" data-brand-carousel="1" data-autoplay-ms="{{attr:autoplayMs}}">
<div class="hero__track" data-list="slides">{{INNER}}</div>
<button type="button" class="hero__arrow hero__arrow--prev" data-action="carousel-prev" aria-label="Previous slide">‹</button>
<button type="button" class="hero__arrow hero__arrow--next" data-action="carousel-next" aria-label="Next slide">›</button>
<div class="hero__dots carousel-dots" role="tablist"></div>
</div></section>
