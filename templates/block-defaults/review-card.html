<article class="wp-block-twork-review-card testimonials__card" data-block="twork/review-card" data-item-id="{{attr:itemId}}">
<span class="testimonials__quote" aria-hidden="true">"</span>
<blockquote class="testimonials__text">{{attr:text}}</blockquote>
<footer class="testimonials__footer">
<img class="testimonials__avatar" src="{{attr:avatarUrl}}" alt="{{attr:avatarAlt}}" width="48" height="48" loading="lazy" decoding="async" />
<div>
<cite class="testimonials__name">{{attr:name}}</cite>
<p class="testimonials__location">{{attr:location}}</p>
</div>
</footer>
</article>
